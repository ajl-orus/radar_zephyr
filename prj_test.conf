# Configurações para ambiente de teste
CONFIG_ZTEST=y
CONFIG_ZTEST_NEW_API=y
CONFIG_TEST_LOGGING_DEFAULTS=n

# Configurações específicas para testes
CONFIG_RADAR_SENSOR_DISTANCE_MM=1000
CONFIG_RADAR_SPEED_LIMIT_LIGHT_KMH=60
CONFIG_RADAR_SPEED_LIMIT_HEAVY_KMH=40
CONFIG_RADAR_WARNING_THRESHOLD_PERCENT=80
CONFIG_RADAR_CAMERA_FAILURE_RATE_PERCENT=20
CONFIG_RADAR_DEBUG_ENABLED=y
CONFIG_RADAR_LOG_LEVEL=4
CONFIG_RADAR_SENSOR_SIMULATION=y

# Aumentar stacks para testes
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_TEST_STACK_SIZE=4096